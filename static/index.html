<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tak (local)</title>
    <link rel="stylesheet" href="main.css">
    <script src="main.js"></script>
</head>

<body>
    <div class="overlay">
        <div class="overlay-body game-options">
            <h1>Local tak against AI</h1>
            <div>
                <span>Opponent</span>
                <select id="opt-ai"></select>
            </div>
            <div>
                <span>You play</span>
                <fieldset">
                    <label><input type="radio" name="opt-color" value="white" checked>white</label>
                    <label><input type="radio" name="opt-color" value="black">black</label>
                </fieldset>
            </div>
            <div>                
                <span>Board size</span>
                <fieldset">
                    <label><input type="radio" name="opt-board-size" value="3">3x3</label>
                    <label><input type="radio" name="opt-board-size" value="4">4x4</label>
                    <label><input type="radio" name="opt-board-size" value="5" checked>5x5</label>
                    <label><input type="radio" name="opt-board-size" value="6">6x6</label>
                    <label><input type="radio" name="opt-board-size" value="7">7x7</label>
                    <label><input type="radio" name="opt-board-size" value="8">8x8</label>
                </fieldset>
            </div>
            <input type="button" value="Start" onclick="startGame()"/>
        </div>
        <div class="empty-spacer"></div>
    </div>

    <div style="display: flex; flex-direction: column;">
        <div class="topbar">
            <div>
                AI: <span id="ai-state">idle</span>
            </div>
            <div>
                <button onclick="resetGame()">New game</button>
            </div>
        </div>
        <iframe
            id="ninja"
            width="100vw" height="100vh"
            style="width: 100%; height: 100vh; max-height: 100vh;"
            frameborder="0"
        ></iframe>
    </div>
</body>

</html>
