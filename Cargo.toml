[package]
name = "tak_local_webui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-stream = "0.3.6"
axum = "0.8.4"
clap = { version = "4.5.48", features = ["derive"] }
futures-util = "0.3.31"
regex = "1.11.2"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
shlex = "1.3.0"
tokio = { version = "1.47.1", features = ["net", "process", "rt-multi-thread"] }
tokio-stream = "0.1.17"
tower-http = { version = "0.6.6", features = ["fs"] }
